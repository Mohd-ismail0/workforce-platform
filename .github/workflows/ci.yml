# Continuous integration for the workforce platform.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    name: Go backend (race, real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The superuser is used ONLY to provision. Everything that runs the
      # application or its tests uses a dedicated NON-SUPERUSER role, because a
      # superuser (or any BYPASSRLS role) silently bypasses row-level security -
      # which would make the cross-organization isolation tests pass for the
      # wrong reason. FORCE ROW LEVEL SECURITY binds the table owner, not a
      # superuser, so the runtime role must be an ordinary role that owns the
      # objects. This mirrors the production split between provisioning and
      # running the workload.
      PGPASSWORD: postgres
      CI_ADMIN_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CI_APP_DB_URL: postgres://workforce_app:workforce_app@127.0.0.1:5432/workforce_ci
      CI_MIGRATION_DB_URL: postgres://workforce_app:workforce_app@127.0.0.1:5432/workforce_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Provision the runtime role and job database
        run: |
          psql "$CI_ADMIN_DB_URL" <<'SQL'
          CREATE ROLE workforce_app LOGIN PASSWORD 'workforce_app'
            NOSUPERUSER NOBYPASSRLS NOCREATEROLE CREATEDB;
          -- The app role OWNS the database (and therefore the public schema in
          -- PG15+), so it can create tables and trusted extensions
          -- (pgcrypto, btree_gist) without superuser. CREATEDB lets internal/testdb
          -- provision one throwaway database per test package.
          CREATE DATABASE workforce_ci OWNER workforce_app;
          GRANT CONNECT ON DATABASE postgres TO workforce_app;
          SQL
          psql "$CI_APP_DB_URL" -c "SELECT current_user, version();"
          echo "workforce_ci provisioned for the non-superuser runtime role"

      - name: Apply migrations (migration owner)
        id: migrate
        run: |
          set -o pipefail
          MIGRATION_DATABASE_URL="$CI_MIGRATION_DB_URL" \
          WORKFORCE_ADOPT_LEGACY_MIGRATIONS=1 \
          go run ./cmd/workforce -migrate 2>&1 | tee /tmp/migrate-output.log

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Full race suite (isolated per-package DBs)
        id: tests
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee /tmp/test-output.log
        env:
          DATABASE_URL: ${{ env.CI_APP_DB_URL }}
          MIGRATION_DATABASE_URL: ${{ env.CI_MIGRATION_DB_URL }}
          # The app role (not the superuser) provisions each package's throwaway
          # database, so those databases are owned by an ordinary role and RLS is
          # enforced there too. It has CREATEDB for exactly this.
          TEST_MASTER_DATABASE_URL: ${{ env.CI_APP_DB_URL }}

      - name: Surface test failure
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo "The test suite failed. Tail of output:"
          tail -120 /tmp/test-output.log
          exit 1

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            /tmp/test-output.log
            /tmp/migrate-output.log
          if-no-files-found: ignore

      - name: Logto provisioning contract guard (mocked, no live provider)
        run: python3 scripts/logto_provision_contract_test.py

  frontend:
    name: Frontend (typecheck, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build

  spec:
    name: Build spec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate spec documents and milestone graph
        run: python3 docs/build-spec/validate_spec.py
